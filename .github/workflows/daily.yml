name: Cập nhật số liệu hằng ngày

on:
  schedule:
    - cron: "35 4 * * 1-5"    # 11:35 giờ Việt Nam: cập nhật giữa phiên (có dữ liệu phiên sáng cho phiên chiều)
    - cron: "25 8 * * *"      # 15:25 giờ Việt Nam (UTC+7), sau phiên
  workflow_dispatch:          # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: write             # ghi lại state/ (trạng thái bộ lọc, lệnh dài)
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Chạy pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bash pipeline/run_all.sh

      - name: Khôi phục dữ liệu cơ bản lần trước (dự phòng nếu Vietcap lỗi)
        if: github.event.schedule != '35 4 * * 1-5'
        uses: actions/cache@v4
        with:
          path: site/data/cb
          key: cb-${{ github.run_id }}
          restore-keys: |
            cb-

      - name: Dữ liệu cơ bản toàn HOSE (Vietcap IQ, lỗi không làm dừng cả lượt)
        if: github.event.schedule != '35 4 * * 1-5'
        continue-on-error: true
        timeout-minutes: 25
        run: python3 pipeline/co_ban_v2.py --all --workers 6

      - name: Ghi lại trạng thái (state/), chỉ khi phiên đã đóng cửa (sau 15:10 giờ VN)
        if: github.event.schedule != '35 4 * * 1-5'
        run: |
          HM=$(TZ=Asia/Ho_Chi_Minh date +%H%M); DOW=$(TZ=Asia/Ho_Chi_Minh date +%u)
          if [ "$DOW" -le 5 ] && [ "$HM" -ge 900 ] && [ "$HM" -lt 1510 ]; then
            echo "Đang trong giờ giao dịch ($HM), không ghi trạng thái để tránh lưu tín hiệu từ dữ liệu dở dang."
            exit 0
          fi
          git config user.name  "atl-bot"
          git config user.email "atl-bot@users.noreply.github.com"
          git add pipeline/state pipeline/dash_out/kiem_dinh.json
          git diff --cached --quiet || (git commit -m "Cập nhật trạng thái $(date -u +%F)" && git pull --rebase --autostash && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
