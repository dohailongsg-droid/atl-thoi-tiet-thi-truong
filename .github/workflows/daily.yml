name: Cập nhật số liệu hằng ngày

on:
  schedule:
    - cron: "16 2 * * 1-5"    # 09:16 giờ Việt Nam: cập nhật đầu phiên (ngay sau ATO, dữ liệu hôm nay mới có phút đầu)
    - cron: "35 4 * * 1-5"    # 11:35 giờ Việt Nam: cập nhật giữa phiên (có dữ liệu phiên sáng cho phiên chiều)
    - cron: "25 8 * * *"      # 15:25 giờ Việt Nam (UTC+7), sau phiên
  workflow_dispatch:          # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: write             # ghi lại state/ (trạng thái bộ lọc, lệnh dài)
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # luôn lấy bản mới nhất, kể cả lượt chạy xếp hàng chờ (tránh đọc state cũ gây báo trùng)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Chạy pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bash pipeline/run_all.sh

      - name: Gửi tiêu điểm sáng lên Telegram (chỉ lượt 09:16 đầu phiên)
        if: github.event.schedule == '16 2 * * 1-5'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 pipeline/tin_telegram.py

      - name: Khôi phục dữ liệu cơ bản lần trước (dự phòng nếu Vietcap lỗi)
        uses: actions/cache@v4
        with:
          path: site/data/cb
          key: cb-${{ github.run_id }}
          restore-keys: |
            cb-

      - name: Dữ liệu cơ bản toàn HOSE (Vietcap IQ, lỗi không làm dừng cả lượt)
        if: github.event.schedule != '35 4 * * 1-5' && github.event.schedule != '16 2 * * 1-5'
        continue-on-error: true
        timeout-minutes: 25
        run: python3 pipeline/co_ban_v2.py --all --workers 6

      - name: Cảnh báo Telegram (sau phiên báo đổi vùng và MUA mới, trong phiên chỉ báo lệnh đang giữ chạm điểm thoát)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 pipeline/canh_bao.py

      - name: Ghi lại trạng thái (state/), chỉ khi phiên đã đóng cửa (sau 15:10 giờ VN)
        if: github.event.schedule != '35 4 * * 1-5' && github.event.schedule != '16 2 * * 1-5'
        run: |
          HM=$(TZ=Asia/Ho_Chi_Minh date +%H%M); DOW=$(TZ=Asia/Ho_Chi_Minh date +%u)
          if [ "$DOW" -le 5 ] && [ "$HM" -ge 900 ] && [ "$HM" -lt 1510 ]; then
            echo "Đang trong giờ giao dịch ($HM), không ghi trạng thái để tránh lưu tín hiệu từ dữ liệu dở dang."
            exit 0
          fi
          git config user.name  "atl-bot"
          git config user.email "atl-bot@users.noreply.github.com"
          git add pipeline/state pipeline/dash_out/kiem_dinh.json
          git diff --cached --quiet || (git commit -m "Cập nhật trạng thái $(date -u +%F)" && git pull --rebase -X theirs --autostash && git push)

      - name: Chụp toàn bộ nội dung trang thành văn bản cho AI khác đọc (lỗi không làm đỏ cả lượt)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python3 pipeline/chup_web.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  bao_loi:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Báo Telegram khi lượt chạy đỏ
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TELEGRAM_BOT_TOKEN=$(printf %s "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]'); TELEGRAM_CHAT_ID=$(printf %s "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "Chưa cấu hình Telegram, bỏ qua."; exit 0; fi
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ ATL: lượt cập nhật số liệu bị lỗi (${{ github.event.schedule || 'chạy tay' }}). Xem: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
