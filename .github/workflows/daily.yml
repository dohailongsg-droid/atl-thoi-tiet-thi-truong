name: Cập nhật số liệu hằng ngày

on:
  schedule:
    - cron: "25 8 * * *"      # 15:25 giờ Việt Nam (UTC+7), sau phiên
  workflow_dispatch:          # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: write             # ghi lại state/ (trạng thái bộ lọc, lệnh dài)
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Chạy pipeline
        env:
             GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
             GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bash pipeline/run_all.sh

      - name: Ghi lại trạng thái (state/)
        run: |
          git config user.name  "atl-bot"
          git config user.email "atl-bot@users.noreply.github.com"
          git add pipeline/state pipeline/dash_out/kiem_dinh.json
          git diff --cached --quiet || (git commit -m "Cập nhật trạng thái $(date -u +%F)" && git pull --rebase && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
